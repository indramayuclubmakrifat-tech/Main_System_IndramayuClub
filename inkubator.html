        .card-back { transform: rotateY(180deg); color: gold; padding: 10px; box-sizing: border-box; }
        .lvl-hard { color: red; font-weight: bold; font-size: 12px; }
        #display-komentar { border: 1px solid #333; height: 100px; overflow-y: auto; background: #000; margin-top: 20px; padding: 10px; font-size: 12px; text-align: left; }
        .running-text { color: yellow; font-weight: bold; background: black; padding: 5px; }
    </style>
</head>

            <div class="card-inner">

                    <div class="level-badge lvl-hard">LVL 3: HARD</div>

        function hitungPotonganKas() {
            let jumlah = prompt("Masukkan nominal transaksi untuk Bank Pusat (IDR):");
            if (jumlah && !isNaN(jumlah)) {
                let potong = jumlah * 0.05; // Pajak Sakral 5%
                let sisa = jumlah - potong;
                alert("📂 LAPORAN NUR 6:\n----------------------\nTotal Input: Rp " + parseInt(jumlah).toLocaleString() + 
                      "\nPotongan Kas (5%): Rp " + potong.toLocaleString() + 
                      "\nMasuk Saldo Bank: Rp " + sisa.toLocaleString());
            } else if (jumlah) {
                alert("Gunakan angka saja, Pak!");
            }
        }

        // Jalur Komunikasi localStorage (Pesan dari Depan)
        setInterval(() => {
            const pesanMasuk = localStorage.getItem('pesanDimensiDepan');
            if (pesanMasuk) {
                const display = document.getElementById('display-komentar');
                const chatBaru = document.createElement('div');
                chatBaru.innerHTML = `<span style="color:cyan">🌀 [Kawat]:</span> ${pesanMasuk}`;
                display.appendChild(chatBaru);
                display.scrollTop = display.scrollHeight;
                localStorage.removeItem('pesanDimensiDepan');
            }
        }, 1000);
