<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indramayu Club - Piramida Guard</title>
    <style>
        :root {
            --emas: #ffd700;
            --langit: #00c3ff;
            --gelap: #111;
            --card-bg: rgba(34, 34, 34, 0.9);
        }

        body {
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .main-wrapper {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* --- SCREENSAVER / MONITOR --- */
        .visual-screen {
            position: relative;
            height: 200px;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--emas);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .visual-screen img { width: 100%; height: 100%; object-fit: cover; }
        
        .live-tag {
            position: absolute; top: 10px; right: 10px;
            background: red; color: white; font-size: 9px;
            padding: 3px 8px; border-radius: 4px; animation: blink 1s infinite;
        }

        #clock {
            position: absolute; bottom: 10px; left: 10px;
            font-size: 18px; font-weight: bold; text-shadow: 2px 2px 4px black;
        }

        /* --- MENU GRID 10 FOLDER --- */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .card-front {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }
        .card-front:active { transform: scale(0.95); border-color: var(--langit); }
        .nur-id { font-size: 11px; font-weight: bold; color: var(--emas); }
        .nur-task { font-size: 9px; color: #aaa; text-transform: uppercase; }

        /* --- BUTTONS --- */
        .btn-backup {
            background: #440000;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid red;
        }

        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.3;} 100% {opacity: 1;} }
    </style>
</head>
<body>

<div class="main-wrapper">
    
    <div class="visual-screen">
        <img src="https://uploads.onecompiler.io/448r2umqe/44aq6y4je/1000023476.jpg" alt="Indramayu Club">
        <div class="live-tag">LIVE EMULATOR</div>
        <div id="clock">00:00:00</div>
        <div style="position:absolute; bottom: 10px; right: 10px; font-size: 10px; color: var(--emas);">PIRAMIDA GUARD</div>
    </div>

    <div style="text-align: center; font-size: 12px; color: var(--emas); letter-spacing: 1px;">
        10 DIMENSI MAKRIFAT - AI STUDIO FOLDERS
    </div>

    <div class="menu-grid">
        <a href="https://ai.studio/apps/379f5974-54d2-4922-9a65-4ee51bacf7fa" class="card-front">
            <div class="nur-id">Nur 3</div>
            <div class="nur-task">Admin Komentar</div>
        </a>

        <a href="https://ai.studio/apps/cbafa9ed-972c-44eb-8adf-ebc7759579f2" class="card-front">
            <div class="nur-id">Nur 4</div>
            <div class="nur-task">Studio Kreator</div>
        </a>

        <a href="https://ai.studio/apps/61b74539-37e7-414a-b134-c2fe33764cd8" class="card-front">
            <div class="nur-id">Nur 7</div>
            <div class="nur-task">Media Sosial</div>
        </a>

        <a href="https://ais-dev-fkifeuqbupkf2kloldq4uv-612359027571.asia-east1.run.app" class="card-front">
            <div class="nur-id">Nur 8</div>
            <div class="nur-task">Game & Arisan</div>
        </a>

        <a href="https://ai.studio/apps/03003f47-194f-4511-8c65-2e17c2c0f465" class="card-front">
            <div class="nur-id">Nur 9</div>
            <div class="nur-task">Penjaga Celengan</div>
        </a>

        <a href="https://ai.studio/apps/fea67ee7-2e48-4dc7-9926-d9646b184ee9" class="card-front">
            <div class="nur-id">Nur 10</div>
            <div class="nur-task">Piramida Guard</div>
        </a>
    </div>

    <div class="menu-grid" style="margin-top: 10px;">
        <a href="02_Emulator.html" class="card-front" style="border-color: var(--langit);">🎮 EMULATOR</a>
        <a href="BANk_gedung.html" class="card-front" style="border-color: var(--langit);">🏛️ BANK</a>
    </div>

    <div class="btn-backup" onclick="panggilBackup()">
        🛡️ RESET (FOLDER H)
    </div>

</div>

<script>
    // Real-time Clock
    function updateTime() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('id-ID');
    }
    setInterval(updateTime, 1000);
    updateTime();

    // Fungsi Backup Nur 8
    function panggilBackup() {
        if(confirm("Nur 8: Apakah Bapak ingin melakukan Backup dan Reset sistem?")) {
            document.body.style.opacity = "0.3";
            setTimeout(() => {
                alert("✅ Sistem Berhasil Di-Backup dan Di-Reset.");
                document.body.style.opacity = "1";
            }, 2000);
        }
    }
</script>

</body>
</html>
