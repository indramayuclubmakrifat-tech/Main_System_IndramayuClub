<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indramayu Club - Game Streaming</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --hutan-tua: #06140b;
  --daun: #1d6b3a;
  --zamrud: #27ae60;
  --emas: #d4af37;
  --emas-terang: #ffd700;
  --emas-muda: #f7e27b;
  --batik: #0e2415;
  --kartu: #0f1f15;
  --teks: #fffdf2;
  --abu-emas: #c9a227;
}

* { box-sizing: border-box; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: repeating-linear-gradient(45deg, var(--batik) 0px, var(--batik) 20px, var(--hutan-tua) 20px, var(--hutan-tua) 40px), var(--hutan-tua);
  color: var(--teks);
  margin: 0;
  padding: 0;
  min-height: 100vh;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
  position: relative;
}

.disclaimer {
  background: rgba(212,175,55,0.12);
  border: 1px dashed var(--emas);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 0.8rem;
  color: var(--emas-muda);
  margin-bottom: 16px;
  text-align: center;
}

/* USER INFO */
.user-info {
  background: linear-gradient(135deg, #0f1f15, #1a3323);
  border: 1.5px solid var(--emas);
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.user-level {
  font-family: 'Cinzel', serif;
  font-size: 1.2rem;
  color: var(--emas-muda);
  font-weight: 700;
}

.user-id {
  font-size: 0.9rem;
  color: var(--abu-emas);
}

.btn-claim {
  background: linear-gradient(135deg, var(--emas), var(--emas-terang));
  color: var(--hutan-tua);
  border: none;
  padding: 12px 24px;
  border-radius: 8px;
  font-weight: 900;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(255,215,0,0.5);
  transition: all 0.3s ease;
  font-family: 'Cinzel', serif;
  letter-spacing: 0.05em;
}

.btn-claim:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 0 25px rgba(255,215,0,0.8);
}

.btn-claim:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* COIN DISPLAY PANEL */
.coin-panel {
  background: linear-gradient(135deg, #112d1b, #0a1f12);
  border: 2px solid var(--emas-terang);
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
  box-shadow: 0 0 30px rgba(212,175,55,0.4);
}

.coin-box {
  background: rgba(0,0,0,0.3);
  border: 1.5px solid var(--emas);
  border-radius: 10px;
  padding: 15px;
  text-align: center;
}

.coin-icon { font-size: 2rem; margin-bottom: 8px; }

.coin-amount {
  font-family: 'Cinzel', serif;
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--emas-terang);
  text-shadow: 0 0 10px rgba(255,215,0,0.6);
  margin: 5px 0;
}

.coin-label {
  font-size: 0.8rem;
  color: var(--emas-muda);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* STREAMING AREA */
.streaming-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.streaming-card {
  background: linear-gradient(145deg, var(--kartu), #14291c);
  border: 1.5px solid var(--emas);
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(212,175,55,0.3);
  position: relative;
}

.streaming-card.tier-sultan {
  border: 2.5px solid var(--emas-terang);
  box-shadow: 0 0 35px rgba(255,215,0,0.55);
}

.streaming-card.tier-sultan .stream-header {
  background: linear-gradient(90deg, #7a5c00, var(--emas-terang));
}

.streaming-card.tier-sultan .stream-title {
  color: var(--hutan-tua);
}

.tier-badge {
  font-size: 0.7rem;
  background: rgba(0,0,0,0.35);
  border: 1px solid var(--hutan-tua);
  color: var(--hutan-tua);
  padding: 2px 8px;
  border-radius: 20px;
  font-weight: 900;
  margin-left: 8px;
}

.stream-header {
  background: linear-gradient(90deg, #1d6b3a, #27ae60);
  padding: 15px;
  border-bottom: 2px solid var(--emas-terang);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.stream-title {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  color: var(--emas-muda);
}

.live-indicator {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #ff3b3b;
  color: white;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 0.8rem;
  font-weight: 700;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* the stream box holds the video AND is the launch pad for floating gifts */
.stream-embed {
  width: 100%;
  height: 260px;
  background: #000;
  position: relative;
  overflow: hidden;
}

.stream-embed iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* GIFT FLY LAYER - floating gifts fly up over the video */
.gift-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.flying-gift {
  position: absolute;
  bottom: -10px;
  font-size: 2.2rem;
  animation: floatUp 2.6s ease-in forwards;
  filter: drop-shadow(0 0 6px rgba(255,215,0,0.8));
}

@keyframes floatUp {
  0% {
    transform: translateY(0) translateX(0) rotate(0deg) scale(0.6);
    opacity: 0;
  }
  10% {
    opacity: 1;
    transform: translateY(-10%) translateX(var(--drift,0px)) scale(1);
  }
  100% {
    transform: translateY(-260px) translateX(var(--drift,0px)) rotate(20deg) scale(1.1);
    opacity: 0;
  }
}

.combo-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: linear-gradient(135deg, var(--emas), var(--emas-terang));
  color: var(--hutan-tua);
  font-family: 'Cinzel', serif;
  font-weight: 900;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.85rem;
  opacity: 0;
  transition: opacity 0.2s ease;
  z-index: 5;
}

.combo-badge.show { opacity: 1; }

.stream-footer {
  padding: 15px;
  background: rgba(0,0,0,0.2);
}

.stream-stats {
  display: flex;
  justify-content: space-around;
  margin-bottom: 12px;
  font-size: 0.9rem;
}

.stat-item { text-align: center; }

.stat-label {
  color: var(--abu-emas);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.stat-value { color: var(--emas-terang); font-weight: 700; }

/* GIFT BUTTONS */
.gift-buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.btn-gift {
  padding: 10px 4px;
  border: 1.5px solid var(--emas);
  background: rgba(212,175,55,0.1);
  color: var(--emas-terang);
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: 'Inter', sans-serif;
}

.btn-gift:hover:not(:disabled) {
  background: linear-gradient(135deg, var(--emas), var(--emas-terang));
  color: var(--hutan-tua);
  transform: scale(1.05);
}

.btn-gift:disabled { opacity: 0.4; cursor: not-allowed; }

/* TOAST NOTIFICATION */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 90vw;
}

.toast {
  background: linear-gradient(135deg, var(--hutan-tua), var(--kartu));
  border: 2px solid var(--emas);
  color: var(--emas-terang);
  padding: 12px 18px;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 700;
  box-shadow: 0 0 20px rgba(212,175,55,0.4);
  animation: slideIn 0.3s ease forwards;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}

/* TRANSACTION LOG */
.transaction-log {
  background: linear-gradient(135deg, #0f1f15, #1a3323);
  border: 1.5px solid var(--emas);
  border-radius: 10px;
  padding: 15px;
  margin-top: 20px;
}

.transaction-log h3 {
  color: var(--emas-muda);
  margin-bottom: 10px;
  font-family: 'Cinzel', serif;
}

.transaction-item {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px dashed rgba(212,175,55,0.2);
  font-size: 0.85rem;
  flex-wrap: wrap;
}

.tx-time { color: var(--abu-emas); }
.tx-amount { color: var(--emas-terang); font-weight: 700; }
.empty-log { color: var(--abu-emas); font-size: 0.85rem; padding: 10px 0; }
</style>
</head>
<body>

<div class="container">
  <div class="disclaimer">🎮 Ini adalah game hiburan. StarPoin, GiftPoin &amp; TiketPoin adalah poin virtual dalam game — <b>bukan uang sungguhan</b> dan tidak bisa ditukar ke Rupiah.</div>

  <!-- USER INFO -->
  <div class="user-info">
    <div>
      <div class="user-level" id="userLevel">Loading...</div>
      <div class="user-id" id="userId">User ID: -</div>
    </div>
    <button class="btn-claim" id="btnDailyReward" onclick="claimDailyReward()">📅 Klaim Hadiah Harian</button>
  </div>

  <!-- COIN DISPLAY -->
  <div class="coin-panel">
    <div class="coin-box">
      <div class="coin-icon">⭐</div>
      <div class="coin-amount" id="starAmount">0</div>
      <div class="coin-label">StarPoin</div>
    </div>
    <div class="coin-box">
      <div class="coin-icon">🎁</div>
      <div class="coin-amount" id="giftAmount">0.00</div>
      <div class="coin-label">GiftPoin</div>
    </div>
    <div class="coin-box">
      <div class="coin-icon">🎫</div>
      <div class="coin-amount" id="tiketAmount">0</div>
      <div class="coin-label">TiketPoin</div>
    </div>
    <div class="coin-box">
      <div class="coin-icon">🏆</div>
      <div class="coin-amount" id="totalEarnedAmount">0</div>
      <div class="coin-label">Total Poin Terkumpul</div>
    </div>
  </div>

  <!-- STREAMING CARDS -->
  <div class="streaming-grid" id="streamingGrid"></div>

  <!-- TRANSACTION LOG -->
  <div class="transaction-log">
    <h3>📋 Riwayat Aktivitas</h3>
    <div id="transactionList" style="max-height: 260px; overflow-y: auto;"></div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="kartu">
<h3>🔥 BANK IDE VIRAL FB 2026</h3>
<div id="bankIde" style="text-align:left;font-size:12px;max-height:300px;overflow-y:auto;"></div>
<button onclick="randomIde()">🎰 SPIN IDE VIRAL</button>
</div>

<script>
const ideViral = [
  "POV: Kalah 50x push-up karena kalah Mobile Legend 😂 #Gaming",
  "Fakta Mengejutkan: 1 Hal Ini Bikin HP Kamu Lemot #Fakta",
  "Tutorial 30 Detik: Hemat 100rb/bulan cuma ganti kebiasaan ini #Edukasi",
  "Masak Indomie Level Sultan tapi modal 5rb #Masak",
  "Curhat Ojol: Penumpang paling ngeselin #Relate",
  "Perbandingan: iPhone 11 vs HP 2jt mana menang? #Teknologi",
  "Story Time: Ketipu online shop #Drama",
  "Life Hack: Buka tutup botol pake sendal #LifeHack",
  "Reaksi Kaget Liat Harga Sembako 2026 #Viral",
  "Challenge: 1 Hari Tanpa Scroll FB #Challenge",
  "Duet Sound Viral TikTok versi Bapak-Bapak #Duet",
  "Review Jujur: Makanan 10rb vs 50rb #FoodReview",
  "Motivasi: Gagal 10x tapi tetep coba lagi #Motivasi",
  "Tips: Cara bikin video FB Pro rame #TipsFB",
  "Komedi: Kalau Listrik Mati Pas Lagi Ngecharge #Komedi",
  "Unboxing: Paket Isi Angin #Unboxing",
  "Eksperimen: Sabun + Mentos + Coke #Eksperimen",
  "ASMR: Suara hujan + ngetik #ASMR",
  "Green Screen: Reaksi liat saldo Rp 0 #GreenScreen",
  "Transisi: Dari gembel jadi sultan 3 detik #Transisi"
];
function randomIde(){
  const i = ideViral[Math.floor(Math.random()*ideViral.length)];
  bankIde.innerHTML = `<div style="background:#0a1811;padding:12px;border:1px dashed var(--emas);border-radius:8px;margin-bottom:8px;">${i}<br><br><b>Caption:</b> Hayo setuju gak? Komen 👇<br><b>Hashtag:</b> #FYP #Viral #FBPro #2026</div>`;
}
randomIde(); // Auto muncul 1 pas buka
// ====== KONFIGURASI GAME (poin virtual, hiburan saja) ======
const STREAMS = [
  { id: 'S001', name: 'Video Sesi 1', embedUrl: 'https://www.youtube.com/embed/d-QRlNGVR_0', tier: 'reguler' },
  { id: 'S002', name: 'Video Sesi 2', embedUrl: 'https://www.youtube.com/embed/gQlk_ghXK0U', tier: 'reguler' },
  { id: 'S003', name: 'Ruang Sultan 👑', embedUrl: 'https://www.youtube.com/embed/34PUV5pAvHM', tier: 'sultan' }
];

const GIFT_EMOJIS = ['🎁','💎','🌟','👑','🔥','🎉'];

// ====== STATE (tersimpan di browser, per perangkat) ======
let state = {
  userId: null,
  level: 'level1',
  star: 0,
  gift: 0,
  tiket: 0,
  totalEarned: 0,
  lastClaim: null,
  history: []
};

function loadState() {
  const saved = localStorage.getItem('gameStreamState');
  if (saved) {
    try { state = JSON.parse(saved); } catch(e) {}
  }
  if (!state.userId) {
    state.userId = 'player_' + Math.random().toString(36).substr(2, 7);
  }
  saveState();
}

function saveState() {
  localStorage.setItem('gameStreamState', JSON.stringify(state));
}

function addHistory(desc, amount, coinType) {
  state.history.unshift({ time: Date.now(), desc, amount, coinType });
  state.history = state.history.slice(0, 15);
}

// ====== INIT ======
function init() {
  loadState();
  renderStreams();
  updateDisplay();

  const today = new Date().toDateString();
  if (state.lastClaim === today) {
    document.getElementById('btnDailyReward').disabled = true;
    document.getElementById('btnDailyReward').textContent = '✅ Sudah Diklaim Hari Ini';
  }
}

function updateDisplay() {
  document.getElementById('starAmount').textContent = state.star.toLocaleString('id-ID');
  document.getElementById('giftAmount').textContent = state.gift.toFixed(2);
  document.getElementById('tiketAmount').textContent = state.tiket.toLocaleString('id-ID');
  document.getElementById('totalEarnedAmount').textContent = state.totalEarned.toLocaleString('id-ID');
  document.getElementById('userLevel').textContent = (state.level === 'sultan' ? '👑 Sultan' : '🌱 Level 1') + ' Player';
  document.getElementById('userId').textContent = 'User ID: ' + state.userId.toUpperCase();
  updateTransactionLog();
  saveState();
}

// ====== RENDER STREAM CARDS ======
function renderStreams() {
  const grid = document.getElementById('streamingGrid');
  grid.innerHTML = '';

  STREAMS.forEach(stream => {
    const isSultan = stream.tier === 'sultan';
    const card = document.createElement('div');
    card.className = 'streaming-card' + (isSultan ? ' tier-sultan' : '');

    // gift costs scale up for the Sultan room
    const starCost = isSultan ? 100 : 10;
    const giftCost = isSultan ? 5 : 0.5;
    const tiketCost = isSultan ? 10 : 1;

    card.innerHTML = `
      <div class="stream-header">
        <div class="stream-title">${stream.name}${isSultan ? '<span class="tier-badge">VIP</span>' : ''}</div>
        <div class="live-indicator">● LIVE</div>
      </div>
      <div class="stream-embed" id="embed-${stream.id}">
        <iframe src="${stream.embedUrl}" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        <div class="gift-layer" id="giftlayer-${stream.id}"></div>
        <div class="combo-badge" id="combo-${stream.id}"></div>
      </div>
      <div class="stream-footer">
        <div class="stream-stats">
          <div class="stat-item">
            <div class="stat-label">Penonton</div>
            <div class="stat-value">${isSultan ? '4.8K' : '1.2K'}</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Durasi</div>
            <div class="stat-value">2j 15m</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Tier</div>
            <div class="stat-value">${isSultan ? '👑 SULTAN' : 'REGULER'}</div>
          </div>
        </div>
        <div class="gift-buttons">
          <button class="btn-gift" onclick="throwGift('star', ${starCost}, '${stream.id}', '⭐')">⭐ ${starCost}</button>
          <button class="btn-gift" onclick="throwGift('gift', ${giftCost}, '${stream.id}', '${isSultan ? '👑' : '🎁'}')">${isSultan ? '👑' : '🎁'} ${giftCost}</button>
          <button class="btn-gift" onclick="throwGift('tiket', ${tiketCost}, '${stream.id}', '🎫')">🎫 ${tiketCost}</button>
          <button class="btn-gift" onclick="earnStreaming('${stream.id}')">💎 Nonton +Poin</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

// ====== GIFT: melayang di layar ======
let comboCounters = {};

function spawnFloatingGift(streamId, emoji) {
  const layer = document.getElementById('giftlayer-' + streamId);
  if (!layer) return;
  const el = document.createElement('div');
  el.className = 'flying-gift';
  el.textContent = emoji;
  const leftPct = 10 + Math.random() * 70;
  const drift = (Math.random() * 60 - 30) + 'px';
  el.style.left = leftPct + '%';
  el.style.setProperty('--drift', drift);
  el.style.fontSize = (1.6 + Math.random() * 1.4) + 'rem';
  layer.appendChild(el);
  setTimeout(() => el.remove(), 2700);
}

function showCombo(streamId) {
  comboCounters[streamId] = (comboCounters[streamId] || 0) + 1;
  const badge = document.getElementById('combo-' + streamId);
  if (!badge) return;
  badge.textContent = 'x' + comboCounters[streamId] + ' COMBO!';
  badge.classList.add('show');
  clearTimeout(badge._t);
  badge._t = setTimeout(() => {
    badge.classList.remove('show');
    comboCounters[streamId] = 0;
  }, 1800);
}

// ====== AKSI GAME ======
function claimDailyReward() {
  const today = new Date().toDateString();
  if (state.lastClaim === today) {
    showToast('⚠️ Hadiah harian sudah diklaim hari ini');
    return;
  }
  const reward = 50;
  state.star += reward;
  state.totalEarned += reward;
  state.lastClaim = today;
  addHistory('Hadiah Harian', reward, 'StarPoin');
  updateDisplay();
  showToast(`🎉 Hadiah harian diklaim! +${reward} StarPoin`);
  document.getElementById('btnDailyReward').disabled = true;
  document.getElementById('btnDailyReward').textContent = '✅ Sudah Diklaim Hari Ini';
}

function throwGift(coinType, amount, streamId, emoji) {
  const balanceKey = coinType; // 'star' | 'gift' | 'tiket'
  if (state[balanceKey] < amount) {
    showToast(`❌ ${labelFor(coinType)} tidak cukup!`);
    return;
  }
  state[balanceKey] -= amount;

  // spawn a small burst of floating gifts
  const burst = coinType === 'gift' ? 3 : 1;
  for (let i = 0; i < burst; i++) {
    setTimeout(() => spawnFloatingGift(streamId, emoji), i * 120);
  }
  showCombo(streamId);

  addHistory(`Kirim gift ke ${streamId}`, -amount, labelFor(coinType));
  updateDisplay();
  showToast(`${emoji} Terkirim ${amount} ${labelFor(coinType)} ke ${streamId}!`);
}

function earnStreaming(streamId) {
  const earned = Math.floor(5 + Math.random() * 15);
  state.star += earned;
  state.totalEarned += earned;
  addHistory(`Nonton streaming ${streamId}`, earned, 'StarPoin');
  updateDisplay();
  showToast(`💎 +${earned} StarPoin dari nonton ${streamId}!`);
}

function labelFor(coinType) {
  return { star: 'StarPoin', gift: 'GiftPoin', tiket: 'TiketPoin' }[coinType] || coinType;
}

// ====== TOAST ======
function showToast(message) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ====== LOG ======
function updateTransactionLog() {
  const list = document.getElementById('transactionList');
  if (!state.history.length) {
    list.innerHTML = '<div class="empty-log">Belum ada aktivitas. Coba klaim hadiah harian atau kirim gift!</div>';
    return;
  }
  list.innerHTML = state.history.map(tx => `
    <div class="transaction-item">
      <span class="tx-time">${new Date(tx.time).toLocaleTimeString('id-ID')}</span>
      <span>${tx.desc}</span>
      <span class="tx-amount">${tx.amount > 0 ? '+' : ''}${tx.amount} ${tx.coinType}</span>
    </div>
  `).join('');
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
